[project]
name = "scheherazades-hoard"
version = "0.1.0"
description = "A storytelling engine that remembers: world state, continuity and dice, outside the model's context."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luis Salet" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
    "mcp==1.9.4",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
screenshots = [
    "playwright==1.63.0",
    "pillow==12.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scheherazades_hoard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
